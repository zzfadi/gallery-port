<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*@TITLE@*/</title>
<meta name="description" content="Fadi Zuabi. Five ways to read one record, and an archive of forty pages built by different AI models.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/*@ICON@*/">
<style>
/*@FONT_FACES@*/

:root{--ink:#F5F3EE;--dim:#B7BCCB;--amber:#F7AC08;--night:#0A0C14}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);overflow-anchor:none;font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid #9CC2FF;outline-offset:3px}

/* ---- the five pages: shared basics, then each page's own rules ---- */
.page{position:relative;text-align:left}
.page h1,.page h2,.page h3,.page p,.page ul,.page ol,.page figure,.page blockquote{margin:0}
.page ul,.page ol{padding:0;list-style:none}
.page img{display:block;max-width:100%}
.page a{color:inherit;text-underline-offset:3px}
.page a:hover{text-decoration-thickness:2px}
/*@SCOPED_CSS@*/

/* ---- without script: a plain list, the five pages one after another, then the archive as a grid ---- */
#sky,#wafer,#veil,.dial,#spacer,.fog,.roll,.curl,.pool,#ingot,#cap,#fold,#mast .where{display:none}
#probe{position:fixed;left:0;top:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none}
#mast{padding:14px clamp(16px,2.6vw,30px)}
.who{font-weight:700;font-size:17px}
#skip{display:flex;flex-wrap:wrap;gap:0 20px;padding:0 clamp(16px,2.6vw,30px) 14px;font-size:15px}
#skip a{color:var(--ink);padding:8px 0;text-underline-offset:3px}
#scene2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:32px clamp(16px,2.6vw,30px) 56px}
.tile{display:block;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
.tile img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:#161a26}
.tile span{display:block;margin-top:6px}

/* ---- with script: the stage ---- */
html.js #stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100svh;overflow:hidden;overflow:clip;perspective:var(--P,1800px);perspective-origin:50% 44%;
  background:radial-gradient(120% 85% at 50% 28%,#262d42 0%,#151929 46%,#0A0C14 100%)}
html.js #sky{display:block;position:absolute;inset:0;pointer-events:none}
html.js #sky::after{content:"";position:absolute;left:50%;top:var(--gy,62%);width:var(--gw,1100px);height:var(--gh,360px);transform:translate(-50%,-50%);opacity:var(--go,1);
  background:radial-gradient(closest-side,rgba(247,172,8,.22),rgba(247,172,8,.08) 52%,rgba(247,172,8,0) 100%)}
html.js #sky::before{content:"";position:absolute;left:50%;top:50%;width:min(130vw,1900px);height:130%;transform:translate(-50%,-50%);opacity:var(--bo,0);
  background:radial-gradient(closest-side,rgba(120,160,230,.2),rgba(120,160,230,.06) 55%,rgba(120,160,230,0) 100%)}
html.js #stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:var(--bo,0);background:linear-gradient(180deg,rgba(10,12,20,.8) 0%,rgba(10,12,20,0) 15%,rgba(10,12,20,0) 76%,rgba(10,12,20,.92) 100%)}
html.js #mast{position:absolute;left:0;top:0;z-index:4;display:flex;align-items:baseline;gap:10px;pointer-events:none}
html.js #mast .where{display:inline;font-size:15px;color:var(--dim);opacity:var(--bo,0)}
html.js #skip{position:absolute;left:12px;top:50px;z-index:6;flex-direction:column;flex-wrap:nowrap;gap:0;padding:8px 16px;background:#0A0C14;border:1px solid rgba(255,255,255,.35);border-radius:10px;opacity:0;pointer-events:none}
html.js #skip:focus-within{opacity:1;pointer-events:auto}
html.js #scene,html.js #scene2{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%}
html.js #scene2{display:none;padding:0}
html.js #archive{display:none}
html.js #veil{display:block;position:absolute;inset:0;z-index:1;background:#10131e;opacity:1;transition:opacity .9s ease;pointer-events:none}
html.js #veil.is-out{opacity:0}
@media (prefers-reduced-motion:reduce){html.js #veil{transition:none}}

/* the wafer and the five pages that stand on it */
html.js .card{position:absolute;left:0;top:0;width:100%;height:var(--H,100vh);transform-origin:50% 0;will-change:transform,opacity;--s:.4}
html.js .clip{position:absolute;left:0;top:0;width:100%;height:var(--h0,60vh);overflow:hidden;overflow:clip;background:#fff;
  box-shadow:0 0 0 calc(1px/var(--s)) rgba(255,255,255,.16),0 calc(26px/var(--s)) calc(60px/var(--s)) rgba(0,0,0,.5)}
html.js .fog{display:block;position:absolute;inset:0;background:#0B0E18;opacity:0;pointer-events:none}
html.js .curl{display:block;position:absolute;left:0;right:0;bottom:0;height:calc(34px/var(--s));background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.2));pointer-events:none}
html.js .pool{display:block;position:absolute;left:4%;width:92%;top:var(--h0,60vh);height:calc(64px/var(--s));background:radial-gradient(closest-side,color-mix(in srgb,var(--p2) 62%,transparent),transparent);opacity:.55;pointer-events:none}
html.js .roll{display:block;position:absolute;left:-1.1%;width:102.2%;top:var(--h0,60vh);height:40px;border-radius:999px;
  background:linear-gradient(180deg,var(--p1) 0%,var(--p2) 46%,var(--p3) 100%);
  box-shadow:0 calc(10px/var(--s)) calc(22px/var(--s)) rgba(0,0,0,.55),inset 0 calc(-2px/var(--s)) calc(3px/var(--s)) rgba(0,0,0,.25)}

html.js #wafer{display:block;position:absolute;left:50%;top:0;width:var(--D,1400px);height:var(--D,1400px);margin:calc(var(--D,1400px)/-2) 0 0 calc(var(--D,1400px)/-2);will-change:transform,opacity;
  background:
    radial-gradient(closest-side,rgba(255,236,190,0) 0 94%,rgba(255,226,160,.45) 97.6%,rgba(255,206,110,.95) 99.3%,rgba(255,206,110,0) 100%),
    radial-gradient(closest-side,#5b4719 0%,#3b2d10 52%,#1e1608 100%)}
html.js #wafer i{display:block;position:absolute;border-radius:50%}
html.js #wafer .dies{inset:7%;
  background:
    linear-gradient(rgba(255,214,130,.17),rgba(255,214,130,.17)) center/100% 26% no-repeat,
    linear-gradient(rgba(255,214,130,.17),rgba(255,214,130,.17)) center/26% 100% no-repeat,
    repeating-linear-gradient(0deg,rgba(255,228,176,.2) 0 2px,rgba(255,228,176,0) 2px var(--die,54px)),
    repeating-linear-gradient(90deg,rgba(255,228,176,.2) 0 2px,rgba(255,228,176,0) 2px var(--die,54px));
  -webkit-mask-image:radial-gradient(closest-side,#000 0 78%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(closest-side,#000 0 78%,rgba(0,0,0,0) 100%)}
html.js #wafer .sheen{inset:0;
  background:conic-gradient(from 0deg,rgba(255,200,90,0) 0deg,rgba(255,224,160,.36) 22deg,rgba(255,200,90,.02) 58deg,rgba(132,178,255,.2) 120deg,rgba(255,200,90,.02) 168deg,rgba(255,224,160,.3) 206deg,rgba(255,200,90,.02) 250deg,rgba(255,142,178,.15) 306deg,rgba(255,200,90,0) 360deg);
  animation:sheen 44s linear infinite}
@keyframes sheen{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){html.js #wafer .sheen{animation:none}}

/* the archive: forty pages wound around a column */
html.js #ingot{display:block;position:absolute;left:50%;top:-30%;height:160%;width:var(--IW,1500px);margin-left:calc(var(--IW,1500px)/-2);will-change:transform;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,rgba(255,255,255,0) 2px 7.2%),
    linear-gradient(90deg,#04060a 0%,#131926 9%,#2b3445 24%,#4a566c 38%,#5c6a82 44%,#3c4759 56%,#1d2432 76%,#0b0e16 92%,#04060a 100%)}
html.js .tile{position:absolute;left:50%;top:50%;width:var(--tw,400px);height:var(--th,250px);margin:calc(var(--th,250px)/-2) 0 0 calc(var(--tw,400px)/-2);overflow:hidden;border-radius:8px;background:#11141d;
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 40px rgba(0,0,0,.5);will-change:transform;visibility:hidden}
html.js .tile img{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
html.js .tile span{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%)}
html.js .tile i{position:absolute;inset:0;background:#0B0E18;opacity:0;pointer-events:none}
html.js .tile.is-front{box-shadow:0 0 0 2px var(--amber),0 24px 52px rgba(0,0,0,.6)}
html.js #cap{display:block;position:absolute;left:clamp(16px,2.6vw,30px);bottom:clamp(14px,2.8vh,26px);z-index:4;margin:0;max-width:min(60vw,270px);pointer-events:none;opacity:var(--bo,0)}
#cap b{display:block;font-size:clamp(20px,2vw,27px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
#cap span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--dim)}

/* the two sideways scrollers. Mouse and trackpad: the script moves them, so vertical scrolling reaches the document. Touch: native, with snap. */
html.js .dial{display:flex;position:absolute;inset:0;z-index:2;overflow:hidden;touch-action:pan-y;scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){html.js .dial{overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;touch-action:auto}}
html.js .dial::-webkit-scrollbar{display:none}
.dial .snap{flex:0 0 var(--item,600px);height:100%;scroll-snap-align:center}
.dial .pad{flex:0 0 calc(50% - var(--item,600px)/2);height:100%}
html.js #turner2 .snap{flex-basis:var(--item2,240px)}
html.js #turner2 .pad{flex-basis:calc(50% - var(--item2,240px)/2)}
html.js .dial.is-dragging{scroll-snap-type:none;cursor:grabbing}
html.js .dial.is-settling{scroll-snap-type:none}
html.js #turner2,html.js #stage.is-archive #turner{visibility:hidden;pointer-events:none}
html.js #stage.is-archive #turner2{visibility:visible;pointer-events:auto}
html.js #stage.is-moving .dial,html.js #stage.is-flipping .dial{overflow:hidden;pointer-events:none}

/* the fold in the corner that flips between the two views */
html.js #fold{display:flex;position:absolute;right:0;bottom:0;z-index:5;align-items:flex-end;gap:10px;padding:0;border:0;background:none;color:var(--ink);font:600 14px/1 'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
#fold .lab{padding-bottom:16px;color:var(--dim)}
#fold:hover .lab,#fold:focus-visible .lab{color:var(--ink)}
#fold .ear{position:relative;width:74px;height:74px;transform-origin:100% 100%;transition:transform .28s ease}
#fold:hover .ear,#fold:focus-visible .ear{transform:scale(1.16)}
#fold .ear::before{content:"";position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,#5c6a82,#2b3445)}
#fold .ear::after{content:"";position:absolute;inset:0;clip-path:polygon(100% 0,0 100%,0 0);background:linear-gradient(135deg,#f3efe5 0%,#d8d2c4 58%,#8f897c 100%)}
html.js #stage.is-archive #fold .ear::before{background:linear-gradient(135deg,#f7ac08,#6b4a05)}
html.js #stage.is-moving #fold{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#fold .ear{transition:none}}

#back{position:fixed;right:16px;bottom:16px;z-index:10;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(10,12,20,.9);color:#F5F3EE;font:600 15px/1 'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#back:hover{background:#0A0C14;border-color:#F5F3EE}
#back[hidden]{display:none}

/* ---- one page open: it is an ordinary page again ---- */
html.js body.is-page{overflow-x:clip}
html.js body.is-page #stage{position:relative;height:auto;overflow:visible;perspective:none;background:none}
html.js body.is-page #stage::after{display:none}
html.js body.is-page #scene{position:static;transform-style:flat}
html.js body.is-page #sky,html.js body.is-page #wafer,html.js body.is-page #veil,html.js body.is-page .dial,html.js body.is-page #mast,html.js body.is-page #skip,html.js body.is-page #scene2,html.js body.is-page #cap,html.js body.is-page #fold,html.js body.is-page .roll,html.js body.is-page .fog,html.js body.is-page .curl,html.js body.is-page .pool,html.js body.is-page #spacer{display:none}
html.js body.is-page .card{visibility:hidden}
html.js body.is-page .card:not(.is-open){transform:none!important}
html.js body.is-page .card.is-open{visibility:visible;position:relative;height:auto;margin-top:var(--S,90vh);will-change:auto}
html.js body.is-page .card.is-open .clip{position:relative;height:auto;overflow:visible;box-shadow:none;border-radius:0;background:none}
html.js #spacer{display:block}
</style>
</head>
<body>

<div id="stage">
<div id="sky" aria-hidden="true"></div>

<header id="mast"><span class="who">Fadi Zuabi</span><span class="where">Archive</span></header>

<nav id="skip" aria-label="Pages">
<!--@SKIP@-->
<a href="#archive">Archive</a>
</nav>

<div id="scene">
<div id="wafer" aria-hidden="true"><i class="dies"></i><i class="sheen"></i></div>

<!--@CARDS@-->
</div>

<button type="button" id="fold" aria-label="Open the archive"><span class="lab" id="fold-lab">Archive</span><span class="ear" aria-hidden="true"></span></button>

<span id="archive"></span>
<div id="scene2" aria-label="Archive: forty pages built by different AI models, and the CoFlow notice">
<div id="ingot" aria-hidden="true"></div>
<!--@TILES@-->
</div>

<div id="veil" aria-hidden="true"></div>
<div id="turner" class="dial" aria-hidden="true"></div>
<div id="turner2" class="dial" aria-hidden="true"></div>

<p id="cap" aria-hidden="true"><b id="cap-a"></b><span id="cap-b"></span></p>

</div>

<div id="spacer" aria-hidden="true"></div>
<div id="probe" aria-hidden="true"></div>

<button type="button" id="back" hidden><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="10" cy="11" rx="7.5" ry="3.6"/><path d="M10 2.8v6.4M7.4 5.2 10 2.6l2.6 2.6"/></svg>All five</button>

<script>
(function () {
  'use strict';
  var SITE = /*@SITE@*/false, OLD_IDS = /*@OLD_IDS@*/[], START_TILE = /*@START_TILE@*/0;
  var doc = document.documentElement;
  var firstHash = decodeURIComponent((location.hash || '').slice(1));

  // Links to the old gallery (zuabi.dev/#terminal-opus) keep working once this page is the front door.
  if (SITE && firstHash && OLD_IDS.indexOf(firstHash) >= 0) { location.replace('gallery.html#' + firstHash); return; }

  doc.classList.add('js');
  function q(s) { return document.querySelector(s); }
  function all(s) { return [].slice.call(document.querySelectorAll(s)); }
  var stage = q('#stage'), veil = q('#veil'), sky = q('#sky'), scene = q('#scene'), scene2 = q('#scene2'), wafer = q('#wafer'), ingot = q('#ingot');
  var spacer = q('#spacer'), probe = q('#probe'), mast = q('#mast'), back = q('#back'), fold = q('#fold'), foldLab = q('#fold-lab'), capA = q('#cap-a'), capB = q('#cap-b');
  var cards = all('.card'), N = cards.length;
  var parts = cards.map(function (c) {
    return { card: c, clip: c.querySelector('.clip'), page: c.querySelector('.page'), fog: c.querySelector('.fog'), roll: c.querySelector('.roll'), curl: c.querySelector('.curl'), pool: c.querySelector('.pool'),
             key: c.getAttribute('data-key'), tr: '', op: -1, fg: -1, hh: -1 };
  });
  var tiles = all('.tile'), T = tiles.length;
  var tinfo = tiles.map(function (a) {
    return { el: a, fog: a.querySelector('i'), design: a.getAttribute('data-design'), model: a.getAttribute('data-model'), date: a.getAttribute('data-date'), tr: '', fg: -1, vis: false };
  });

  var STEP = 2 * Math.PI / N, TILT = 22 * Math.PI / 180, SIN_T = Math.sin(TILT), COS_T = Math.cos(TILT);
  var FACES = 8, FACE = 2 * Math.PI / FACES; // the archive column has eight faces
  var BASE = N * 20;                        // where the wafer's scroller starts, far from either end
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touchScroller = window.matchMedia('(pointer: coarse)').matches;   // touch screens scroll the dials natively

  var W = 0, H = 0, P = 1800, s0 = 0.4, R = 500, h0 = 600, S = 800, foot0 = 0;      // the wafer
  var tw = 400, th = 250, Rc = 800, pitch = 24, IW = 1500;                              // the archive column
  var sel = 0, mode = 'ring', view = 'ring', flip = 0, flipAnim = null, shown = '';
  var kIdx = BASE, aIdx = Math.min(Math.max(START_TILE, 0), Math.max(T - 1, 0)), frontTile = -1, raf = 0, announced = false;
  var t0 = performance.now(), introDur = reduced ? 0 : 2100;
  var px = 0, py = 0, tx = 0, ty = 0;
  var lastAct = performance.now(), peeks = 0, peek = null, lastSy = 0, lastLeft = -1;
  var focusPage = false, focusBack = false, deepNext = null;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function mod(n, m) { return ((n % m) + m) % m; }
  function ease(p) { return p * p * p * (p * (p * 6 - 15) + 10); }
  function outCubic(t) { t = 1 - t; return 1 - t * t * t; }
  function scrollY() { return window.pageYOffset || doc.scrollTop || 0; }
  function setInert(el, on) { if ('inert' in el) el.inert = on; else if (on) el.setAttribute('aria-hidden', 'true'); else el.removeAttribute('aria-hidden'); }
  function act() { lastAct = performance.now(); peek = null; }
  // The stage itself never scrolls. Where a browser cannot clip without scrolling, a link to a page's #name would drag the scene out of place.
  function pin() { if (stage.scrollTop || stage.scrollLeft) { stage.scrollTop = 0; stage.scrollLeft = 0; } }
  stage.addEventListener('scroll', pin);

  // The wafer's outline: a circle with one flat edge.
  (function () {
    var pts = [], a;
    for (a = 248; a <= 582; a += 4.175) pts.push((50 + 50 * Math.cos(a * Math.PI / 180)).toFixed(2) + '% ' + (50 + 50 * Math.sin(a * Math.PI / 180)).toFixed(2) + '%');
    wafer.style.clipPath = 'polygon(' + pts.join(',') + ')';
  })();

  // A dial: a sideways scroller with one stop per item. Wheel, trackpad, drag and touch all move it.
  function makeDial(el, o) {
    var d = { el: el, item: 400, drag: null, wheel: null, timer: 0, run: 0, dragged: false };
    var f = document.createDocumentFragment(), i, s;
    s = document.createElement('div'); s.className = 'pad'; f.appendChild(s);
    for (i = 0; i < o.stops; i++) { s = document.createElement('div'); s.className = 'snap'; f.appendChild(s); }
    s = document.createElement('div'); s.className = 'pad'; f.appendChild(s);
    el.appendChild(f);
    function lim(n) { return n < 0 ? 0 : n > o.stops - 1 ? o.stops - 1 : n; }
    d.pos = function () { return el.scrollLeft / d.item; };
    d.idx = function () { return Math.round(el.scrollLeft / d.item); };
    d.jump = function (n) { el.scrollLeft = lim(n) * d.item; };
    d.go = function (n) {                                   // glide to a stop, then let the scroller snap by itself again
      var run = ++d.run; n = lim(n);
      el.classList.add('is-settling'); el.classList.remove('is-dragging');
      el.scrollTo({ left: n * d.item, behavior: reduced ? 'auto' : 'smooth' });
      var fin = function () { el.removeEventListener('scrollend', fin); if (run !== d.run) return; el.classList.remove('is-settling'); };
      el.addEventListener('scrollend', fin); setTimeout(fin, 900);
    };
    d.wheelEvent = function (ev) {                          // one notch of a mouse wheel is one stop; a trackpad moves with the fingers
      if (ev.ctrlKey) return;
      var dx = ev.deltaX, dy = ev.deltaY, delta;
      if (ev.shiftKey && !dx) { dx = dy; dy = 0; }
      if (o.bothAxes) delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
      else { if (Math.abs(dx) <= Math.abs(dy)) return; delta = dx; }     // mostly vertical: the document scrolls
      ev.preventDefault();
      if (!o.enabled()) return;
      act();
      if (ev.deltaMode === 1) delta *= 32; else if (ev.deltaMode === 2) delta *= W;
      if (!d.wheel) { d.wheel = { start: d.idx() }; d.run++; el.classList.add('is-dragging'); }
      el.scrollLeft += delta;
      clearTimeout(d.timer);
      d.timer = setTimeout(function () {
        var w = d.wheel; d.wheel = null;
        if (!w) return;
        var cur = d.pos(), moved = cur - w.start, t = Math.round(cur);
        if (Math.abs(moved) < 0.07) t = w.start; else if (moved > 0) t = Math.max(w.start + 1, t); else t = Math.min(w.start - 1, t);
        d.go(t);
      }, 130);
    };
    el.addEventListener('pointerdown', function (ev) {      // mouse always; touch and pen only where the scroller is not native
      if (ev.pointerType === 'mouse' ? ev.button !== 0 : touchScroller) return;
      if (!o.enabled()) return;
      act(); d.run++;
      d.drag = { x: ev.clientX, left: el.scrollLeft, moved: false, id: ev.pointerId, lx: ev.clientX, lt: ev.timeStamp, v: 0 };
    });
    window.addEventListener('pointermove', function (ev) {
      var g = d.drag;
      if (!g || ev.pointerId !== g.id) return;
      var dx = ev.clientX - g.x;
      if (!g.moved && Math.abs(dx) > 5) { g.moved = true; el.classList.add('is-dragging'); try { el.setPointerCapture(g.id); } catch (err) {} }
      if (g.moved) {
        el.scrollLeft = g.left - dx * (o.dragGain || 1.2);
        var dt = ev.timeStamp - g.lt;
        if (dt > 0) { g.v = (ev.clientX - g.lx) / dt; g.lx = ev.clientX; g.lt = ev.timeStamp; }
      }
    });
    function end() {
      var g = d.drag;
      if (!g) return;
      d.drag = null;
      if (!g.moved) return;
      d.dragged = true; setTimeout(function () { d.dragged = false; }, 60);
      d.go(Math.round((el.scrollLeft - g.v * 240) / d.item));
    }
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
    el.addEventListener('click', function (ev) { if (d.dragged) { d.dragged = false; return; } act(); o.click(ev); });
    return d;
  }
  function hit(ev, sel) {                                   // what lies under a click on a dial
    var els = document.elementsFromPoint(ev.clientX, ev.clientY), j, c;
    for (j = 0; j < els.length; j++) { c = els[j].closest ? els[j].closest(sel) : null; if (c) return c; }
    return null;
  }

  function turnable() { return mode === 'ring' && view === 'ring' && !flipAnim && scrollY() < S * 0.05; }
  var ring = makeDial(q('#turner'), { stops: BASE * 2 + 1, bothAxes: false, enabled: turnable, click: function (ev) {
    var c = hit(ev, '.card');                               // the page in front opens, any other page comes to the front
    if (!c || !turnable()) return;
    var i = cards.indexOf(c);
    if (i === sel) openPage(false); else goToPage(i);
  } });
  var arch = makeDial(q('#turner2'), { stops: Math.max(T, 1), bothAxes: true, dragGain: 0.9, enabled: function () { return view === 'archive' && !flipAnim; }, click: function (ev) {
    var a = hit(ev, '.tile');                               // the page in front opens in the gallery, any other comes to the front
    if (!a) return;
    var i = tiles.indexOf(a);
    if (i === frontTile) a.click(); else arch.go(i);
  } });

  // The wheel turns whichever view is showing, wherever on the stage the pointer is.
  stage.addEventListener('wheel', function (ev) {
    if (mode !== 'ring') return;                              // an open page scrolls as usual
    (view === 'archive' || (flipAnim && flipAnim.to === 1) ? arch : ring).wheelEvent(ev);
  }, { passive: false });

  function pageHeight(i) { return parts[i].page.offsetHeight; }
  function setSpacer() { spacer.style.height = (view === 'archive' || (flipAnim && flipAnim.to === 1) ? 0 : S + pageHeight(sel)) + 'px'; }

  function measure() {
    var oldS = S, st = doc.style, i;
    W = doc.clientWidth; H = probe.offsetHeight || window.innerHeight;
    var narrow = W < 720;
    P = Math.max(1000, W * 1.3);

    // The wafer: shrink until the five pages and the wafer fit between the name and the bottom edge.
    var cw = narrow ? W * 0.5 : clamp(W * 0.44, 300, 900);
    var hf = narrow ? 0.6 : 0.66, D, kb, kn, a, e2, f, nb, ch, tries;
    var oy = H * 0.44, bandTop = (mast.offsetHeight || 48) + 4, bandBot = H - (narrow ? 58 : 40);
    if (bandBot - bandTop < 160) bandBot = bandTop + 160;
    for (tries = 0; tries < 8; tries++) {
      s0 = cw / W; ch = H * hf * s0;
      R = cw * (narrow ? 0.98 : 0.93);
      kb = P / (P + 2 * R * COS_T);                         // how small things look at the back of the wafer
      kn = P / (P - 0.25 * R * COS_T);                      // and how large at its near edge
      a = 2 * R * SIN_T + ch; e2 = 0.25 * R * SIN_T;
      f = (bandTop - oy * (1 - kb)) / kb + a;               // front foot that puts the back pages' tops on the band's top
      nb = oy * (1 - kn) + (f + e2) * kn;                   // where the wafer's near edge then lands
      foot0 = f;
      if (nb <= bandBot) { foot0 = f + (bandBot - nb) / (kb + kn); break; }
      cw *= Math.max(0.72, (bandBot - bandTop) / (nb - bandTop));
    }
    h0 = Math.round(H * hf);
    S = Math.round(H * 0.9);
    ring.item = Math.round(narrow ? W * 0.62 : clamp(W * 0.4, 420, 620));
    D = Math.round(R * 2.5);

    // The archive column: narrower than the screen, three rows of tiles in view.
    tw = narrow ? W * 0.42 : clamp(W * 0.225, 200, 360);
    if (tw * 0.625 > H * 0.25) tw = H * 0.25 / 0.625;
    tw = Math.round(tw); th = Math.round(tw * 0.625);
    Rc = (tw + (narrow ? 12 : 22)) / (2 * Math.sin(Math.PI / FACES));
    pitch = (th + (narrow ? 18 : 30)) / FACES;              // one full turn climbs one row
    IW = Math.round(Rc * 1.94);
    arch.item = Math.round(narrow ? W * 0.3 : clamp(tw * 0.62, 150, 250));

    st.setProperty('--H', H + 'px'); st.setProperty('--P', P + 'px'); st.setProperty('--S', S + 'px'); st.setProperty('--h0', h0 + 'px');
    st.setProperty('--item', ring.item + 'px'); st.setProperty('--item2', arch.item + 'px');
    st.setProperty('--D', D + 'px'); st.setProperty('--die', Math.round(D * 0.86 / 22) + 'px');
    st.setProperty('--gw', Math.round(D * 1.25) + 'px'); st.setProperty('--gh', Math.round(D * 0.42) + 'px');
    st.setProperty('--tw', tw + 'px'); st.setProperty('--th', th + 'px'); st.setProperty('--IW', IW + 'px');
    for (i = 0; i < N; i++) { parts[i].tr = ''; parts[i].hh = -1; }
    for (i = 0; i < T; i++) tinfo[i].tr = '';
    if (mode === 'ring') { ring.jump(kIdx); arch.jump(aIdx); }
    setSpacer();
    if (mode === 'page' && oldS !== S) window.scrollBy(0, S - oldS);
  }

  function select(n, quiet) {
    parts[sel].card.classList.remove('is-selected');
    sel = n;
    parts[sel].card.classList.add('is-selected');
    setSpacer();
    if (!quiet && announced) { try { history.replaceState(null, '', '#' + parts[sel].key); } catch (err) {} }
  }

  function setFront(i) {
    if (frontTile >= 0) { tiles[frontTile].classList.remove('is-front'); tiles[frontTile].tabIndex = -1; }
    frontTile = i;
    if (i < 0) return;
    var o = tinfo[i], m = /^(\d{4})-(\d{2})$/.exec(o.date || '');
    tiles[i].classList.add('is-front'); tiles[i].tabIndex = 0;
    capA.textContent = o.design;
    capB.textContent = o.model + (m ? ', ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1] + ' ' + m[1] : '');
  }

  // ---- drawing ----------------------------------------------------------------------------------------------------
  function drawRing(now, sy, ringOn) {
    var e = ease(clamp(sy / S, 0, 1)), m = 1 - e;
    var kk = ring.pos() - BASE;
    var it = introDur ? clamp((now - t0) / introDur, 0, 1) : 1;
    var introK = -(1 - outCubic(it)) * 1.3;
    var sway = reduced ? 0 : Math.sin(now / 2800) * 0.014 + px * 0.045;
    var kv = kk + (introK + sway) * m;

    if (e < 0.02 && ringOn) {
      kIdx = ring.idx();
      var ns = mod(kIdx, N);
      if (ns !== sel) select(ns);
      if (it >= 1) announced = true;
    }
    stage.classList.toggle('is-moving', e >= 0.02);

    // A wordless hint, twice at most: the page in front starts to unroll, then settles back.
    var pe = 0;
    if (peek) { var pt = (now - peek) / 1150; if (pt >= 1) peek = null; else pe = Math.sin(Math.PI * pt) * 0.055; }
    else if (!reduced && ringOn && it >= 1 && sy === 0 && peeks < 2 && now - lastAct > (peeks ? 9000 : 3200)) { peek = now; peeks++; lastAct = now; }

    var drop = e * H * 0.2, i, o, d, t, sn, dp, x, z, top, yaw, s, op, fg, hh, tr, ee, mm, rt, sig;
    for (i = 0; i < N; i++) {
      o = parts[i];
      d = i - kv - (i === sel ? 0 : e * 0.55); d -= Math.round(d / N) * N;
      t = d * STEP; sn = Math.sin(t); dp = Math.cos(t) - 1;             // dp: 0 in front, -2 at the back
      if (i === sel) {
        ee = Math.max(e, pe); mm = 1 - ee;
        s = s0 + (1 - s0) * ee; hh = h0 + (H - h0) * ee;
        x = R * sn * m; z = R * COS_T * dp * m; top = (foot0 + R * SIN_T * dp - h0 * s0) * mm; yaw = sn * 24 * m;
        op = 1; fg = -dp * 0.11 * m;
      } else {
        mm = 1; s = s0; hh = h0;
        var Re = R * (1 + 1.4 * e);
        x = Re * sn; z = Re * COS_T * dp - e * 600; top = foot0 + R * SIN_T * dp - h0 * s0 + drop; yaw = sn * 24;
        op = clamp(1 - e * 2.6, 0, 1); fg = -dp * 0.11;
      }
      tr = 'translate3d(' + x.toFixed(2) + 'px,' + top.toFixed(2) + 'px,' + z.toFixed(2) + 'px) rotateY(' + yaw.toFixed(3) + 'deg) scale(' + s.toFixed(5) + ')';
      if (o.tr !== tr) { o.tr = tr; o.card.style.transform = tr; }
      if (o.op !== op) { o.op = op; o.card.style.opacity = op; o.card.style.visibility = op <= 0 ? 'hidden' : ''; }
      fg = Math.round(fg * 1000) / 1000;
      if (o.fg !== fg) { o.fg = fg; o.fog.style.opacity = fg; }
      sig = hh.toFixed(1) + '|' + s.toFixed(4);
      if (o.hh !== sig) {
        o.hh = sig;
        rt = (19 / s0) * Math.pow(mm, 1.25);
        o.card.style.setProperty('--s', s.toFixed(4));
        o.clip.style.height = hh.toFixed(1) + 'px';
        o.clip.style.borderRadius = ((13 / s) * mm).toFixed(2) + 'px';
        o.roll.style.top = (hh - rt * 0.45).toFixed(1) + 'px';
        o.roll.style.height = rt.toFixed(2) + 'px';
        o.roll.style.opacity = mm < 0.04 ? 0 : 1;
        o.curl.style.opacity = mm;
        o.pool.style.top = (hh + rt * 0.5).toFixed(1) + 'px';
        o.pool.style.opacity = 0.55 * mm;
      }
    }

    var wy = foot0 - R * SIN_T + drop, wz = -R * COS_T - e * 300;
    wafer.style.transform = 'translate3d(0,' + wy.toFixed(2) + 'px,' + wz.toFixed(2) + 'px) rotateX(68deg) rotateZ(' + ((kv + e * 0.55) * 72).toFixed(3) + 'deg) scale(' + (1 + e * 1.5).toFixed(4) + ')';
    wafer.style.opacity = clamp(1.25 - e * 1.6, 0, 1);
    var oy = H * 0.44, sc = P / (P - wz);
    sky.style.setProperty('--gy', (oy + (wy - oy) * sc).toFixed(1) + 'px');
    return e;
  }

  function drawArchive(now) {
    var k = arch.pos(), i, o, d, t, cs, y, x, z, near, fg, tr, vis, edge;
    var idx = clamp(Math.round(k), 0, T - 1);
    if (!flipAnim && view === 'archive') aIdx = idx;
    if (idx !== frontTile) setFront(idx);
    var kv = k + (reduced ? 0 : Math.sin(now / 3100) * 0.016 + px * 0.05);
    var half = H * 0.5;
    for (i = 0; i < T; i++) {
      o = tinfo[i];
      d = i - kv; t = d * FACE; cs = Math.cos(t); y = d * pitch;
      vis = cs > 0.05 && Math.abs(y) < half + th * 0.6;
      if (!vis) { if (o.vis) { o.vis = false; o.el.style.visibility = 'hidden'; o.tr = ''; } continue; }
      near = Math.max(0, 1 - Math.abs(d));                               // 1 for the page in front
      x = Rc * Math.sin(t); z = Rc * (cs - 1) + near * 26;
      tr = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,' + z.toFixed(2) + 'px) rotateY(' + (t * 180 / Math.PI).toFixed(3) + 'deg) scale(' + (1 + 0.07 * near).toFixed(4) + ')';
      if (o.tr !== tr) { o.tr = tr; o.el.style.transform = tr; }
      if (!o.vis) { o.vis = true; o.el.style.visibility = 'visible'; }
      edge = Math.abs(y) / half;
      fg = clamp((1 - cs) * 0.85 + (1 - near) * 0.18 + (edge > 0.7 ? (edge - 0.7) * 1.6 : 0), 0, 0.94);
      fg = Math.round(fg * 200) / 200;
      if (o.fg !== fg) { o.fg = fg; o.fog.style.opacity = fg; }
    }
    ingot.style.transform = 'translate3d(0,0,' + (-Rc).toFixed(1) + 'px)';
    ingot.style.backgroundPosition = (-kv * Rc * FACE).toFixed(1) + 'px 0, 0 0';
  }

  function frame(now) {
    raf = 0;
    var sy = scrollY();
    if (sy !== lastSy) { lastSy = sy; act(); }
    if (view === 'ring' && !flipAnim && sy >= S) { enterPage(); return; }

    if (flipAnim) {
      var ft = clamp((now - flipAnim.t0) / flipAnim.dur, 0, 1);
      flip = flipAnim.from + (flipAnim.to - flipAnim.from) * ease(ft);
      if (ft >= 1) { flip = flipAnim.to; flipAnim = null; flipDone(); }
    }
    var want = flip < 0.5 ? 'ring' : 'archive';
    if (want !== shown) { shown = want; scene.style.visibility = want === 'ring' ? '' : 'hidden'; scene2.style.display = want === 'archive' ? 'block' : ''; }

    px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    var e = 0, left = ring.el.scrollLeft + arch.el.scrollLeft;
    if (left !== lastLeft) { lastLeft = left; act(); }
    if (want === 'ring') e = drawRing(now, sy, flip === 0); else drawArchive(now);

    var dip = 1 - 0.14 * Math.sin(Math.PI * flip);
    scene.style.transform = flip > 0 && flip < 0.5 ? 'rotateX(' + (flip * 180).toFixed(2) + 'deg) scale(' + dip.toFixed(4) + ')' : '';
    scene2.style.transform = flip >= 0.5 && flip < 1 ? 'rotateX(' + (-(1 - flip) * 180).toFixed(2) + 'deg) scale(' + dip.toFixed(4) + ')' : '';
    var bo = clamp((flip - 0.5) * 2, 0, 1);
    stage.style.setProperty('--bo', bo.toFixed(3));
    stage.style.setProperty('--go', (clamp(1 - flip * 2, 0, 1) * clamp(1.25 - e * 1.6, 0, 1)).toFixed(3));
    mast.style.opacity = clamp(1 - e * 3.4, 0, 1);
    stage.style.perspectiveOrigin = (50 + px * 2.2 * (1 - e)).toFixed(2) + '% ' + (44 + py * 1.6 * (1 - e)).toFixed(2) + '%';

    raf = requestAnimationFrame(frame);
  }

  // ---- the two views and the open page ------------------------------------------------------------------------------
  function setView(to, instant) {
    if (mode !== 'ring') return;
    if ((flipAnim ? (flipAnim.to === 1 ? 'archive' : 'ring') : view) === to) return;
    if (scrollY() > 0) window.scrollTo(0, 0);
    act();
    flipAnim = { t0: performance.now(), dur: reduced || instant ? 1 : 950, from: flip, to: to === 'archive' ? 1 : 0 };
    stage.classList.add('is-flipping');
    if (to === 'archive') arch.jump(aIdx);
    setSpacer();
  }
  function flipDone() {
    view = flip >= 1 ? 'archive' : 'ring';
    stage.classList.remove('is-flipping');
    stage.classList.toggle('is-archive', view === 'archive');
    setInert(scene2, view !== 'archive');
    foldLab.textContent = view === 'archive' ? 'Back' : 'Archive';
    fold.setAttribute('aria-label', view === 'archive' ? 'Back to the five pages' : 'Open the archive');
    setSpacer();
    try { history.replaceState(null, '', view === 'archive' ? '#archive' : '#' + parts[sel].key); } catch (err) {}
  }

  function enterPage() {
    if (mode === 'page') return;
    mode = 'page';
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    var o = parts[sel];
    document.body.classList.add('is-page');
    o.card.classList.add('is-open');
    o.card.style.transform = 'none'; o.card.style.opacity = ''; o.card.style.visibility = '';
    o.clip.style.height = ''; o.clip.style.borderRadius = '';
    o.tr = ''; o.op = -1; o.hh = -1;
    setInert(o.page, false);
    back.hidden = false;
    if (focusPage) { focusPage = false; o.page.setAttribute('tabindex', '-1'); try { o.page.focus({ preventScroll: true }); } catch (err) {} }
    var tgt = deepNext; deepNext = null;                      // a link to a place inside this page: go there once the page is open
    if (tgt && o.card.contains(tgt)) requestAnimationFrame(function () { if (mode === 'page') tgt.scrollIntoView(); });
  }
  function exitPage() {
    if (mode === 'ring') return;
    mode = 'ring';
    var o = parts[sel];
    document.body.classList.remove('is-page');
    o.card.classList.remove('is-open');
    setInert(o.page, true);
    back.hidden = true;
    ring.jump(kIdx); arch.jump(aIdx);
    if (focusBack) { focusBack = false; try { fold.focus({ preventScroll: true }); } catch (err) {} }
    frame(performance.now());
  }

  function goToPage(i) { var c = ring.idx(), d = mod(i - mod(c, N), N); if (d > N / 2) d -= N; ring.go(c + d); }
  function openPage(byKeyboard) { focusPage = !!byKeyboard; window.scrollTo({ top: S, behavior: reduced ? 'auto' : 'smooth' }); }
  function leavePage(byKeyboard) { focusBack = !!byKeyboard; window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); }
  function showPage(i, target) {                              // from a link: bring that page to the front and open it
    if (mode === 'page' && sel === i) { if (target) target.scrollIntoView(); return; }
    deepNext = target || null;
    if (mode === 'page') window.scrollTo(0, 0);
    if (view === 'archive' || flipAnim) setView('ring', true);
    setTimeout(function () { goToPage(i); setTimeout(function () { openPage(true); }, reduced ? 30 : 650); }, 60);
  }

  all('#skip a').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      var h = (a.getAttribute('href') || '').slice(1), i;
      ev.preventDefault();
      if (h === 'archive') { setView('archive'); return; }
      for (i = 0; i < N; i++) if (parts[i].key === h) showPage(i);
    });
  });
  fold.addEventListener('click', function () { setView((flipAnim ? flipAnim.to === 1 : view === 'archive') ? 'ring' : 'archive'); });
  back.addEventListener('click', function (ev) { leavePage(ev.detail === 0); });
  tiles.forEach(function (a, i) { a.addEventListener('focus', function () { if (view === 'archive' && !flipAnim && arch.idx() !== i) arch.go(i); }); });

  window.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'mouse' && W && H) { tx = (ev.clientX / W - 0.5) * 2; ty = (ev.clientY / H - 0.5) * 2; }
  });
  document.addEventListener('mouseleave', function () { tx = 0; ty = 0; });

  window.addEventListener('keydown', function (ev) {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    act();
    var k = ev.key, step = 0;
    if (mode === 'page') { if (k === 'Escape') leavePage(true); return; }
    if (view === 'archive' && !flipAnim) {
      if (k === 'Escape') { setView('ring'); return; }
      if (k === 'ArrowRight' || k === 'ArrowDown') step = 1; else if (k === 'ArrowLeft' || k === 'ArrowUp') step = -1;
      else if (k === 'Home') step = -T; else if (k === 'End') step = T;
      if (step) {
        var n = clamp(arch.idx() + step, 0, T - 1);
        arch.go(n); ev.preventDefault();
        if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('tile')) { try { tiles[n].focus({ preventScroll: true }); } catch (err) {} }
      }
      return;
    }
    if (!turnable()) return;
    if (k === 'ArrowRight') { ring.go(ring.idx() + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft') { ring.go(ring.idx() - 1); ev.preventDefault(); }
  });

  window.addEventListener('scroll', function () {
    if (mode === 'page' && scrollY() < S - 1) exitPage();
  }, { passive: true });

  window.addEventListener('hashchange', function () {
    var h = decodeURIComponent((location.hash || '').slice(1)), i;
    pin();
    if (!h) return;
    if (SITE && OLD_IDS.indexOf(h) >= 0) { location.replace('gallery.html#' + h); return; }
    if (h === 'archive') { if (mode === 'page') window.scrollTo(0, 0); setTimeout(function () { setView('archive'); }, mode === 'page' ? 80 : 0); return; }
    for (i = 0; i < N; i++) if (parts[i].key === h) { showPage(i); return; }
    var el = document.getElementById(h), host = el && el.closest ? el.closest('.card') : null;
    if (host) showPage(cards.indexOf(host), el);
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (doc.clientWidth !== W || (probe.offsetHeight || window.innerHeight) !== H) measure();
    }, 60);
  });
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { if (mode === 'ring') setSpacer(); });
    parts.forEach(function (o) { ro.observe(o.page); });
  }
  window.addEventListener('load', function () {
    if (mode === 'ring') setSpacer();
    setTimeout(function () { tiles.forEach(function (a) { var im = a.querySelector('img'); if (im) im.loading = 'eager'; }); }, 1500);   // fetch the archive pictures once the wafer is up
  });

  // ---- start: a #name in the address picks a page, the archive, or a place inside a page ------------------------------
  parts.forEach(function (o) { setInert(o.page, true); });
  setInert(scene2, true);
  tiles.forEach(function (a) { a.tabIndex = -1; });
  var start = 0, deep = null, wantArchive = firstHash === 'archive', isKey = false, i;
  for (i = 0; i < N; i++) if (parts[i].key === firstHash) { start = i; isKey = true; }
  if (firstHash && !isKey && !wantArchive) {
    var el = document.getElementById(firstHash), host = el && el.closest ? el.closest('.card') : null;
    if (host) { start = cards.indexOf(host); deep = el; }
  }
  kIdx = BASE + start;
  measure();
  select(start, true);
  ring.jump(kIdx); arch.jump(aIdx);
  setFront(aIdx);
  if (deep) {
    introDur = 0;
    window.scrollTo(0, S); enterPage(); deep.scrollIntoView();
  } else if (wantArchive) {
    introDur = 0; window.scrollTo(0, 0);
    flip = 1; view = 'archive'; flipDone();
    raf = requestAnimationFrame(frame);
  } else if (scrollY() >= S) {
    introDur = 0; enterPage();
  } else {
    if (scrollY() > 4) introDur = 0;
    raf = requestAnimationFrame(frame);
  }
  pin(); window.addEventListener('load', pin);
  requestAnimationFrame(function () { veil.classList.add('is-out'); });
})();
</script>
